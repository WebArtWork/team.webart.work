<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
	<div class="shell header-inner">
		<a routerLink="/" class="brand" aria-label="Web Art Work Esports home"
			><img src="brand-logo.svg" width="37" height="43" alt="" /><span
				>WEB ART WORK<small>ESPORTS CLUB</small></span
			></a
		>
		<nav class="desktop-nav" aria-label="Main navigation">
			<a routerLink="/news">News</a><a routerLink="/games">Games</a
			><a routerLink="/tournaments">Tournaments</a><a routerLink="/teams">Teams</a
			><a routerLink="/media">Media</a><a routerLink="/market">Market</a>
		</nav>
		<div class="header-actions">
			<div class="language-switcher">
				<button
					class="language-button"
					aria-haspopup="true"
					[attr.aria-expanded]="languageMenuOpen()"
					aria-label="Open language menu"
					(click)="languageMenuOpen.set(!languageMenuOpen())"
					type="button"
				>
					{{ currentLanguage()?.code?.toUpperCase() }}
				</button>
				@if (languageMenuOpen()) {
					<ul class="language-menu" role="menu">
						@for (lang of languages(); track lang.code) {
							<li role="none">
								<button
									role="menuitem"
									type="button"
									[attr.aria-label]="'Switch language to ' + lang.name"
									[class.active]="lang.code === currentLanguage()?.code"
									(click)="setLanguage(lang.code)"
								>
									{{ lang.nativeName || lang.name }}
								</button>
							</li>
						}
					</ul>
				}
			</div>
			<a class="cart-button" routerLink="/cart" aria-label="View cart">
				<span aria-hidden="true">🛒</span>
				@if (cartCount() > 0) {
					<span class="cart-badge">{{ cartCount() }}</span>
				}
			</a>
			<button
				class="theme-button"
				[attr.aria-label]="toggleLabel()"
				(click)="toggleMode()"
				type="button"
			>
				<span aria-hidden="true">{{ mode() === 'dark' ? '☀' : '☾' }}</span>
			</button>
			<button
				class="mobile-menu-button"
				type="button"
				aria-controls="mobile-nav"
				[attr.aria-expanded]="mobileMenuOpen()"
				(click)="mobileMenuOpen.set(!mobileMenuOpen())"
			>
				{{ mobileMenuOpen() ? 'Close' : 'Menu' }}
			</button>
		</div>
	</div>
	@if (mobileMenuOpen()) {
		<nav id="mobile-nav" class="mobile-nav shell" aria-label="Mobile navigation">
			<a routerLink="/news" (click)="mobileMenuOpen.set(false)">News</a
			><a routerLink="/games" (click)="mobileMenuOpen.set(false)">Games</a
			><a routerLink="/tournaments" (click)="mobileMenuOpen.set(false)">Tournaments</a
			><a routerLink="/teams" (click)="mobileMenuOpen.set(false)">Teams</a
			><a routerLink="/media" (click)="mobileMenuOpen.set(false)">Media</a
			><a routerLink="/market" (click)="mobileMenuOpen.set(false)">Market</a>
		</nav>
	}
</header>
